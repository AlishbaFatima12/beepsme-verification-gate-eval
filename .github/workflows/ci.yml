name: tests

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt ruff==0.15.0
      - name: Lint
        run: ruff check .
      - name: Unit and reproduction tests
        run: pytest
      - name: Published numbers reproduce exactly
        run: |
          python src/evaluate.py
          python tools/sync_readme.py
          git diff --exit-code -- results/results.json results/results_table.md results/key_findings.md README.md
